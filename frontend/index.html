<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Videojuegos</title>
    <!-- Bootstrap CSS (Puntos para la pauta) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Etiqueta semántica -->
    <header class="bg-dark text-white text-center py-4 mb-4">
        <h1>Catálogo de Videojuegos</h1>
        <p class="lead">LO MEJOR DE LO MEJOR</p>
    </header>

    <!-- Etiqueta semántica -->
    <main class="container">
        <!-- Filtros de búsqueda (Filtro DOM) -->
        <section class="row mb-4">
            <div class="col-md-6 mb-2">
                <input type="text" id="buscador" class="form-control" placeholder="Buscar videojuego por nombre...">
            </div>
            <div class="col-md-6">
                <select id="filtroCategoria" class="form-select">
                    <option value="">Todas las categorías</option>
                    <option value="Acción y Aventura">Acción y Aventura</option>
                    <option value="RPG">RPG</option>
                    <option value="Indie">Indie</option>
                    <option value="Survival">Survival</option>
                    <option value="Horror">Horror</option>
                    <option value="Shooter">Shooter</option>
                    <option value="Cartas">Cartas</option>
                </select>
            </div>
        </section>

        <!-- Contenedor donde se cargan los videojuegos -->
        <section class="row" id="contenedor-productos">
            <!-- Los datos de la base de datos se pintarán aquí automáticamente -->
        </section>
    </main>

    <!-- Etiqueta semántica -->
    <footer class="text-center py-4 mt-5">
        <p>2026 - Proyecto Web con Acceso a Base de Datos, Gracias por ver :D</p>
    </footer>

    <!-- Script JS -->
    <script src="assets/js/script.js"></script>
</body>
</html>
